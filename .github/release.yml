changelog:
  exclude:
    # Promotions from dev to main repeat work already listed by its own PR.
    labels: [promotion]
  categories:
    - title: Fixes
      labels: [bug]
    - title: Features and improvements
      labels: [enhancement]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
