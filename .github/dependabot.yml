version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    # Pull request titles must read "type: summary"; see pull-request-title.yml.
    commit-message:
      prefix: deps
    schedule:
      interval: monthly
    labels: [dependencies, github_actions]
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories:
      - /tools/medal-sync/MedalSync
      - /tools/medal-sync/MedalSync.Launch
      - /tests/tools/medal-sync
      - /tests/desktop
      - /tests/integration
    target-branch: dev
    # Pull request titles must read "type: summary"; see pull-request-title.yml.
    commit-message:
      prefix: deps
    schedule:
      interval: monthly
    labels: [dependencies, .NET]
    groups:
      nuget-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
