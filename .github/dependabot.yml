version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github_actions]
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories:
      - /tools/medal-sync/MedalSync
      - /tools/medal-sync/MedalSync.Launch
      - /tests/tools/medal-sync
      - /tests/integration
    schedule:
      interval: monthly
    labels: [dependencies, .NET]
    groups:
      nuget-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
