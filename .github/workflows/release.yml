name: Release Medal Sync
# Runs on a standard GitHub-hosted runner, which is free for this public
# repository. Release builds deliberately use no caches.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_XMLDOC_MODE: skip
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Audit public source and reachable Git history
        shell: pwsh
        run: python scripts/check-repository.py --history
      - name: Verify release tag and main ancestry
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.VersionPrefix
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match Directory.Build.props.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main.' }
      - name: Validate
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Package and verify
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1
      - name: Verify native install and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .medal-sync-dist/medal-sync-*-setup-win-x64.exe
            .medal-sync-dist/medal-sync-*-win-x64.zip
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.VersionPrefix
          $archive = ".medal-sync-dist/medal-sync-$version-win-x64.zip"
          $setup = ".medal-sync-dist/medal-sync-$version-setup-win-x64.exe"
          gh release create $env:RELEASE_TAG $setup "$setup.sha256" $archive "$archive.sha256" --verify-tag --draft --generate-notes --title "Medal Sync $version"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; existing releases are never overwritten.' }
