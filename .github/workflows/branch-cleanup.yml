name: Clean up closed PR branches
# Only same-repository PRs need cleanup; fork PR tokens remain read-only.
# Always check out trusted default-branch code, including on unmerged closures.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Closed pull request number to clean up
        required: true
        type: number
permissions: {}
concurrency:
  group: branch-cleanup-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/cleanup-pr-branch.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Delete the closed PR branch if it is still unused and unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python scripts/cleanup-pr-branch.py --repository "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --apply
