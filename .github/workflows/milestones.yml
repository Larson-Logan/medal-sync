name: Release milestones
# Each release has a milestone titled with its version (MAJOR.MINOR.PATCH).
# A pull request merged to dev, and every issue it closes, joins the earliest
# open milestone newer than the latest published release, so a milestone lists
# what its release ships. Promotions from dev to main are not work items. Publishing a release closes its milestone once
# nothing in it is still open. Release tags add a hotfix counter
# (vMAJOR.MINOR.PATCH.NN) that milestones ignore; the release workflow calls
# this workflow after publishing a .00 release. No code is checked out or run.
on:
  push:
    branches: [dev]
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Published release tag whose milestone to close.
        type: string
        required: true
permissions: {}
concurrency:
  group: milestones
  cancel-in-progress: false
jobs:
  assign:
    name: Add merged work to the next release milestone
    # A call from the release workflow also arrives as a push event, with a tag.
    if: github.event_name == 'push' && !inputs.tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          # True when version $1 sorts after $2; anything is newer than nothing.
          newer() { [ -z "$2" ] || { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ]; }; }

          prs="$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '.[] | select(.merged_at != null and .base.ref == "dev") | "\(.number)\t\(.milestone.title // "")"')"
          if [ -z "$prs" ]; then
            echo "No merged pull request for $SHA; nothing to add."
            exit 0
          fi

          released="$(gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | ltrimstr("v")' \
            | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$/\1/' \
            | { grep -Ex "$semver" || true; } | sort -V | tail -n 1)"
          version_at() {
            gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/Directory.Build.props?ref=$1" \
              | sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p'
          }
          version="$(version_at "$SHA")"
          parent="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
          previous="$(version_at "$parent")"
          # Open version milestones newer than $1, earliest first, as "title<TAB>number".
          upcoming() {
            gh api --paginate "repos/$REPO/milestones?state=open&per_page=100" --jq '.[] | "\(.title)\t\(.number)"' \
              | { grep -E "^[0-9]+\.[0-9]+\.[0-9]+"$'\t' || true; } | sort -V \
              | while IFS=$'\t' read -r t n; do if newer "$t" "$1"; then printf '%s\t%s\n' "$t" "$n"; fi; done
          }

          title=''
          number=''
          if grep -Eqx "$semver" <<<"$version" && [ "$version" != "$previous" ] && newer "$version" "$released"; then
            # This commit bumps the version, so it belongs to that release and its
            # milestone takes the version as its title.
            title="$version"
            planned="$(upcoming "$released")"
            number="$(awk -F'\t' -v v="$version" '$1 == v { print $2 }' <<<"$planned")"
            first="$(head -n 1 <<<"$planned")"
            if [ -z "$number" ] && [ -n "$first" ] && newer "$version" "$(cut -f 1 <<<"$first")"; then
              number="$(cut -f 2 <<<"$first")"
              gh api --method PATCH "repos/$REPO/milestones/$number" -f "title=$version" --silent
              echo "Renamed milestone $(cut -f 1 <<<"$first") to $version" >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            # A bumped but unpublished version is promoted to main and drafted
            # next, so later work goes to the milestone after it.
            floor="$released"
            if grep -Eqx "$semver" <<<"$version" && newer "$version" "$floor"; then floor="$version"; fi
            first="$(upcoming "$floor" | sed -n 1p)"
            if [ -n "$first" ]; then
              title="$(cut -f 1 <<<"$first")"
              number="$(cut -f 2 <<<"$first")"
            else
              # Nothing is planned yet: assume a patch release. Rename it for a minor or major.
              IFS=. read -r major minor patch <<<"${floor:-0.0.0}"
              title="$major.$minor.$((patch + 1))"
            fi
          fi
          if [ -z "$number" ]; then
            number="$(gh api --method POST "repos/$REPO/milestones" -f "title=$title" \
              -f 'description=Created automatically for work merged after the last release.' --jq .number)"
            echo "Created milestone $title" >>"$GITHUB_STEP_SUMMARY"
          fi

          # Move an item unless it already has this milestone or a non-version milestone.
          assign() {
            if [ "$2" = "$title" ]; then return; fi
            if [ -n "$2" ] && ! grep -Eqx "$semver" <<<"$2"; then
              echo "#$1 keeps its milestone '$2'."
              return
            fi
            gh api --method PATCH "repos/$REPO/issues/$1" -F "milestone=$number" --silent </dev/null
            echo "- #$1 → $title" >>"$GITHUB_STEP_SUMMARY"
          }
          # GraphQL variables, not shell ones.
          # shellcheck disable=SC2016
          closing='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){closingIssuesReferences(first:50){nodes{number repository{nameWithOwner} milestone{title}}}}}}'
          while IFS=$'\t' read -r pr current; do
            assign "$pr" "$current"
            issues="$(gh api graphql -f "query=$closing" -f "owner=${REPO%/*}" -f "name=${REPO#*/}" -F "number=$pr" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == env.REPO) | "\(.number)\t\(.milestone.title // "")"' </dev/null)"
            while IFS=$'\t' read -r issue current; do
              if [ -n "$issue" ]; then assign "$issue" "$current"; fi
            done <<<"$issues"
          done <<<"$prs"

  close:
    name: Close the released milestone
    if: inputs.tag || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # Milestones are titled MAJOR.MINOR.PATCH, without the hotfix counter.
          VERSION="$(sed -E 's/^v//; s/^([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+$/\1/' <<<"$TAG")"
          export VERSION
          number="$(gh api --paginate "repos/$REPO/milestones?state=open&per_page=100" \
            --jq '.[] | select(.title == env.VERSION) | .number')"
          if [ -z "$number" ]; then
            echo "No open milestone is titled $VERSION; nothing to close." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remaining="$(gh api --paginate "repos/$REPO/issues?milestone=$number&state=open&per_page=100" \
            --jq '.[] | "- #\(.number) \(.title)"')"
          if [ -n "$remaining" ]; then
            echo "::warning::Milestone $VERSION stays open: move its open items to the next milestone, then close it."
            { echo "Milestone $VERSION still has open items:"; echo "$remaining"; } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method PATCH "repos/$REPO/milestones/$number" -f state=closed --silent
          echo "Closed milestone $VERSION." >>"$GITHUB_STEP_SUMMARY"
