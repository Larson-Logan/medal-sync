name: Publish website
# Publishes site/ (the search-friendly landing page, robots.txt and sitemap)
# to GitHub Pages at https://larson-logan.github.io/medal-sync/. Runs only from
# main, so the site always describes a released version. Pages must be set to
# "GitHub Actions" as its source in the repository settings.
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/medal-sync/MedalSync.Launch/medal-sync.ico', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the app icon as the favicon
        run: cp tools/medal-sync/MedalSync.Launch/medal-sync.ico site/favicon.ico
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
