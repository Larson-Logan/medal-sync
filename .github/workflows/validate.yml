name: Medal Sync Windows validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Audit public source and reachable Git history
        shell: pwsh
        run: python scripts/check-repository.py --history
      - name: Validate standalone companion and tooling
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Smoke test release packaging
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1
      - name: Test native setup, upgrade and uninstall in isolated user installation
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Test real rclone replication and sequential synthetic PCs through WinFsp
        shell: pwsh
        run: ./scripts/test-storage-integration.ps1
      - name: Test native setup with unique registration and synthetic readiness failures
        shell: pwsh
        run: ./scripts/test-windows-installer-isolated.ps1
