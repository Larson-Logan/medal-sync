name: Medal Sync validation
# Public repository: standard GitHub-hosted runners (ubuntu-latest, windows-latest)
# cost no Actions minutes. Never switch these jobs to larger runners, which are
# always billed. Jobs run in parallel to keep wall time short.
#
# Work lands on dev first, and validate must pass for the suites a pull request
# can affect. Only dev merges into main, and a pull request into main always
# runs every suite, so main stays releasable.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  # Main calls this workflow from release.yml so publishing waits for all suites.
  workflow_call:
    inputs:
      release:
        description: Build release assets without caches and retain the tested packages
        type: boolean
        default: false
      revision:
        description: Hotfix counter, or none for the legacy bridge release
        type: string
        default: '00'
permissions:
  contents: read
concurrency:
  # Only superseded PR runs share a group. Calls from release must not contend
  # with standalone validation or with the caller's release concurrency group.
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_XMLDOC_MODE: skip
  MedalReleaseRevision: ${{ inputs.revision || '00' }}
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unit: ${{ steps.scope.outputs.unit }}
      desktop: ${{ steps.scope.outputs.desktop }}
      storage: ${{ steps.scope.outputs.storage }}
    steps:
      - name: Require pull requests into main to come from dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ] || [ "$HEAD_REF" != dev ]; then
            echo "::error::Only dev merges into main. Retarget this pull request to dev."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit public source and reachable Git history
        run: python scripts/check-repository.py --history
      - name: Check source inventory, hygiene and local documentation links
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Repository
      - name: Check the change for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Choose the Windows suites from the source inventory
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # public-source.json maps every file to the suites it affects, and the
        # inventory check above proved it is current. Pull requests into dev
        # run only those suites; pushes and pull requests into main run all.
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; then
            python scripts/update-source-manifest.py --affected HEAD^1 >>"$GITHUB_OUTPUT"
          else
            printf '%s\n' unit=true desktop=true storage=true >>"$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: .NET unit tests
    needs: checks
    if: needs.checks.outputs.unit == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Run .NET unit tests
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Unit

  windows-build:
    name: Desktop, package and native installer
    needs: checks
    if: needs.checks.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.release && '0' || '1' }}
      - name: Verify release ancestry and any existing tag
        if: inputs.release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/storage/medal-sync/MedalSync.Update.psm1
          $version = Get-MedalBuildVersion (Get-Location).Path
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main.' }
          $tagged = git rev-parse --verify --quiet "refs/tags/v$version^{commit}"
          if ($tagged -and $tagged -ne (git rev-parse HEAD)) {
            throw "Tag v$version already exists on another commit. Rerun the workflow to take the next hotfix number."
          }
          $global:LASTEXITCODE = 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Cache NuGet packages
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      # Release validation never uses caches. Cached downloads are re-checked
      # against their SHA-256 pins before use.
      - name: Cache pinned Inno Setup compiler
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/inno-*
          key: inno-${{ runner.os }}-${{ hashFiles('installer/windows/toolchain.json') }}
      - name: Cache pinned storage dependencies
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/storage
          key: storage-deps-${{ runner.os }}-${{ hashFiles('tools/medal-sync/config/dependencies.json') }}
      - name: Build launcher, run native desktop checks and script tests
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Desktop, Scripts
      - name: Smoke test release packaging
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1
      - name: Test native setup, upgrade and uninstall in isolated user installation
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Test native setup with unique registration and synthetic readiness failures
        shell: pwsh
        run: ./scripts/test-windows-installer-isolated.ps1
      # Publish these exact packages only after the aggregate validation passes.
      # Never upload the entire distribution folder: it also holds build staging.
      - name: Retain tested release assets
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          # A full rerun may rebuild after a different suite failed. Failed-job
          # retries can still consume the previous successful build's artifact.
          overwrite: true
          path: |
            .medal-sync-dist/medal-sync-*-setup-win-x64.exe
            .medal-sync-dist/medal-sync-*-setup-win-x64.exe.sha256
            .medal-sync-dist/medal-sync-*-win-x64.zip
            .medal-sync-dist/medal-sync-*-win-x64.zip.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          overwrite: true
          path: |
            .validation/setup-smoke-*/setup.log
            .validation/native-isolated-*/setup.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  storage-integration:
    name: Storage integration (rclone and WinFsp)
    needs: checks
    if: needs.checks.outputs.storage == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Cache pinned storage dependencies
        if: ${{ !inputs.release }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/storage
          key: storage-deps-${{ runner.os }}-${{ hashFiles('tools/medal-sync/config/dependencies.json') }}
      - name: Test real rclone replication and sequential synthetic PCs through WinFsp
        shell: pwsh
        run: ./scripts/test-storage-integration.ps1

  # The required check for main. It passes only when every suite passed, or a
  # suite was skipped because the source inventory showed the change cannot
  # affect it.
  validate:
    if: ${{ !cancelled() }}
    needs: [checks, unit-tests, windows-build, storage-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCOPE: ${{ toJSON(needs.checks.outputs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e --argjson scope "$SCOPE" '
            {"unit-tests": "unit", "windows-build": "desktop", "storage-integration": "storage"} as $suite
            | to_entries | all(
              .value.result == "success"
              or (.value.result == "skipped" and $suite[.key] != null and $scope[$suite[.key]] == "false"))' <<<"$RESULTS" >/dev/null
