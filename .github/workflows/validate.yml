name: Medal Sync validation
# Public repository: standard GitHub-hosted runners (ubuntu-latest, windows-latest)
# cost no Actions minutes. Never switch these jobs to larger runners, which are
# always billed. Jobs run in parallel to keep wall time short.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Superseded pull request runs are cancelled; every main commit is validated.
  group: validate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_XMLDOC_MODE: skip
jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit public source and reachable Git history
        run: python scripts/check-repository.py --history
      - name: Check source inventory, hygiene and local documentation links
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Repository
      - name: Check the change for whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Decide whether the Windows suites are needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Files that never reach a build, test or package. Docs-only pull
          # requests skip the Windows suites; main always runs everything.
          DOCS_ONLY: '^((README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY|SUPPORT)\.md|docs/[^/]+\.md|tests/README\.md|\.github/(ISSUE_TEMPLATE/[^/]+|PULL_REQUEST_TEMPLATE\.md|labels\.json|release\.yml|dependabot\.yml)|public-source\.json)$'
        run: |
          windows=true
          if [ "$EVENT_NAME" = pull_request ]; then
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            if [ -n "$changed" ] && ! grep -Evq "$DOCS_ONLY" <<<"$changed"; then
              windows=false
            fi
          fi
          echo "windows=$windows" >>"$GITHUB_OUTPUT"
          if [ "$windows" = false ]; then
            echo 'Documentation-only change: Windows build, test and installer suites skipped.' >>"$GITHUB_STEP_SUMMARY"
          fi

  unit-tests:
    name: .NET unit tests
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Run .NET unit tests
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Unit

  windows-build:
    name: Desktop, package and native installer
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      # Release builds never use these caches. Cached downloads are re-checked
      # against their SHA-256 pins before use.
      - name: Cache pinned Inno Setup compiler
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/inno-*
          key: inno-${{ runner.os }}-${{ hashFiles('installer/windows/toolchain.json') }}
      - name: Cache pinned storage dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/storage
          key: storage-deps-${{ runner.os }}-${{ hashFiles('tools/medal-sync/config/dependencies.json') }}
      - name: Build launcher, run native desktop checks and script tests
        shell: pwsh
        run: ./scripts/validate.ps1 -Part Desktop, Scripts
      - name: Smoke test release packaging
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1
      - name: Test native setup, upgrade and uninstall in isolated user installation
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Test native setup with unique registration and synthetic readiness failures
        shell: pwsh
        run: ./scripts/test-windows-installer-isolated.ps1
      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: |
            .validation/setup-smoke-*/setup.log
            .validation/native-isolated-*/setup.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  storage-integration:
    name: Storage integration (rclone and WinFsp)
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
      - name: Cache pinned storage dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .validation/build-tools/storage
          key: storage-deps-${{ runner.os }}-${{ hashFiles('tools/medal-sync/config/dependencies.json') }}
      - name: Test real rclone replication and sequential synthetic PCs through WinFsp
        shell: pwsh
        run: ./scripts/test-storage-integration.ps1

  # The single required check. It passes only when every suite passed, or the
  # Windows suites were deliberately skipped for a documentation-only change.
  validate:
    if: ${{ !cancelled() }}
    needs: [checks, unit-tests, windows-build, storage-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          WINDOWS: ${{ needs.checks.outputs.windows }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e --arg windows "$WINDOWS" 'to_entries | all(
            .value.result == "success"
            or (.value.result == "skipped" and .key != "checks" and $windows == "false"))' <<<"$RESULTS" >/dev/null
