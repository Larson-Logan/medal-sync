[global]
    workgroup = WORKGROUP
    server string = Example file server
    server role = standalone server
    security = user
    interfaces = lo eth0
    bind interfaces only = yes
    hosts allow = 127.0.0.1 192.0.2.0/255.255.255.0
    hosts deny = ALL
    smb ports = 445
    disable netbios = yes
    server min protocol = SMB3_11
    server signing = mandatory
    smb encrypt = required
    map to guest = Never
    restrict anonymous = 2
    usershare max shares = 0
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log file = /var/log/samba/log.%m
    max log size = 1000

[Data]
    path = /srv/data
    valid users = testuser
    read only = no
    guest ok = no
    browseable = yes
    create mask = 0660
    directory mask = 0770
    force directory mode = 2000
    follow symlinks = no
    wide links = no
    vfs objects = recycle
    recycle:repository = Recycle/%U
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:touch_mtime = yes
    recycle:directory_mode = 0770
    recycle:subdir_mode = 0770
    recycle:exclude_dir = Recycle Recycle/* Server/Recycle Server/Recycle/* RecordingBuffer

[ServerData]
    path = /srv/data/Server
    valid users = serverdata testuser
    read only = no
    guest ok = no
    browseable = yes
    create mask = 0660
    directory mask = 0770
    force directory mode = 2000
    follow symlinks = no
    wide links = no
    vfs objects = recycle
    recycle:repository = Recycle/%U
    recycle:keeptree = yes
    recycle:versions = yes
    recycle:touch_mtime = yes
    recycle:directory_mode = 2770
    recycle:subdir_mode = 2770
    recycle:exclude_dir = Recycle Recycle/*
